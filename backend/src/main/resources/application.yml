server:
  port: 8080

spring:
  application:
    name: refrigerator-backend
  datasource:
    url: jdbc:h2:mem:refrigerator;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

llm:
  base-url: ${JBNU_LLM_BASE_URL:https://factchat-cloud.mindlogic.ai/v1/gateway}
  api-key: ${JBNU_LLM_API_KEY:}
  model: ${JBNU_LLM_MODEL:claude-sonnet-5}
